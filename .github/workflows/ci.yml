name: Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  consumer:
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@1d3dd4222a5e2000c8d65c7d96d2066ffabe9ceb
    with:
      full_run: true
      jobs: 2
      environment_json: '{"ACCEPTANCE_MARKER":"reusable-workflow"}'
      upload_build: true
      build_artifact_name: cad-ci-workflow-acceptance

  no_output:
    needs: consumer
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@1d3dd4222a5e2000c8d65c7d96d2066ffabe9ceb
    with:
      upload_build: true
      build_artifact_name: cad-ci-empty-acceptance


  same_runner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Run exact released durable same-runner action
        id: cad_ci
        uses: brainboxemb/tool.cad.ci@eb64a46b243db00e8dbb4b78b6643a2a7efa3fb9
        with:
          source_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          durable_scope: durable-action-acceptance
          source_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          jobs: "2"
          environment_json: '{"ACCEPTANCE_MARKER":"same-runner-action"}'
          github_token: ${{ github.token }}

      - name: Verify durable same-runner state and exact published scope
        env:
          ACTION_LIBRARY_REVISION: ${{ steps.cad_ci.outputs.library_revision }}
          EXPECTED_LIBRARY_REVISION: e621daf6e309bdd0e3f643a12007f1b66490696d
          ACTION_SCOPE: ${{ steps.cad_ci.outputs.scope }}
          ACTION_BASE_SHA: ${{ steps.cad_ci.outputs.base_sha }}
          ACTION_FULL_RUN: ${{ steps.cad_ci.outputs.full_run }}
          ACTION_SCOPE_EXISTS: ${{ steps.cad_ci.outputs.scope_exists }}
          ACTION_BUILD_COMMIT: ${{ steps.cad_ci.outputs.build_commit }}
          ACTION_PREPARED_SCOPE: ${{ steps.cad_ci.outputs.prepared_scope }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          import cad_ci
          import cad_ci_tool

          sha = re.compile(r"^[0-9a-f]{40}$")
          tool_root = Path(os.environ["CAD_CI_TOOL_ROOT"]).resolve()
          lib_root = Path(os.environ["CAD_CI_LIB_ROOT"]).resolve()

          tool_file = Path(cad_ci_tool.__file__).resolve()
          lib_file = Path(cad_ci.__file__).resolve()
          if not tool_file.is_relative_to(tool_root):
              raise SystemExit(
                  f"cad_ci_tool is not from action root: {tool_file} vs {tool_root}"
              )
          if not lib_file.is_relative_to(lib_root):
              raise SystemExit(
                  f"cad_ci is not from pinned library root: {lib_file} vs {lib_root}"
              )
          if os.environ["ACTION_LIBRARY_REVISION"] != os.environ["EXPECTED_LIBRARY_REVISION"]:
              raise SystemExit(
                  "action library output does not match exact released pin"
              )

          if os.environ["ACTION_SCOPE"] != "durable-action-acceptance":
              raise SystemExit(f"unexpected durable scope: {os.environ['ACTION_SCOPE']}")
          for name in ("ACTION_BASE_SHA", "ACTION_BUILD_COMMIT", "SOURCE_SHA"):
              if sha.fullmatch(os.environ[name]) is None:
                  raise SystemExit(f"invalid exact sha output {name}: {os.environ[name]}")
          if os.environ["ACTION_FULL_RUN"] not in {"true", "false"}:
              raise SystemExit("invalid full_run output")
          if os.environ["ACTION_SCOPE_EXISTS"] not in {"true", "false"}:
              raise SystemExit("invalid scope_exists output")
          if (
              os.environ["ACTION_SCOPE_EXISTS"] == "false"
              and os.environ["ACTION_FULL_RUN"] != "true"
          ):
              raise SystemExit("initial named scope did not use full-run selection")
          if (
              os.environ["ACTION_SCOPE_EXISTS"] == "true"
              and os.environ["ACTION_FULL_RUN"] != "false"
          ):
              raise SystemExit("existing named scope did not use incremental selection")

          prepared = Path(os.environ["ACTION_PREPARED_SCOPE"]).resolve()
          if not prepared.is_dir():
              raise SystemExit(f"prepared scope is not available on same runner: {prepared}")
          manifest_path = prepared / "build.json"
          if not manifest_path.is_file():
              raise SystemExit(f"prepared scope manifest missing: {manifest_path}")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("source_commit") != os.environ["SOURCE_SHA"]:
              raise SystemExit(f"prepared scope source mismatch: {manifest}")

          completed = subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "cad_ci_tool",
                  "plan",
                  "--repo",
                  ".",
                  "--item",
                  "workflow-case",
                  "--json",
              ],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          )
          rows = json.loads(completed.stdout)
          if [row["id"] for row in rows] != ["workflow-case"]:
              raise SystemExit(f"unexpected same-runner plan: {rows}")

          build_commit = os.environ["ACTION_BUILD_COMMIT"]
          subprocess.run(
              ["git", "fetch", "--no-tags", "--depth=1", "origin", build_commit],
              check=True,
          )
          generated = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{build_commit}:durable-action-acceptance/build.json",
              ],
              text=True,
          )
          generated_manifest = json.loads(generated)
          if generated_manifest.get("source_commit") != os.environ["SOURCE_SHA"]:
              raise SystemExit(
                  f"published named scope source mismatch: {generated_manifest}"
              )
          PY


  candidate_plan:
    # Advanced plan workflow deserves a real API test, not YAML text matching.
    permissions:
      contents: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-plan.yml@1d3dd4222a5e2000c8d65c7d96d2066ffabe9ceb
    with:
      full_run: true

  candidate_action_run_only:
    # Exercise the candidate root action with a read-only token, without
    # durable publication or generated-branch mutations.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Run exact candidate action in run-only mode
        id: cad
        uses: brainboxemb/tool.cad.ci@1d3dd4222a5e2000c8d65c7d96d2066ffabe9ceb
        with:
          source_sha: ${{ github.event.pull_request.head.sha }}
          full_run: "true"
          jobs: "2"
          github_token: ${{ github.token }}

      - name: Check candidate CLI remains available in the same runner
        env:
          ACCEPTED_LIBRARY: e621daf6e309bdd0e3f643a12007f1b66490696d
          ACTION_LIBRARY: ${{ steps.cad.outputs.library_revision }}
        run: |
          if [ "$ACCEPTED_LIBRARY" != "$ACTION_LIBRARY" ]; then
            echo "candidate action exposed unexpected library pin" >&2
            exit 1
          fi
          python -m cad_ci_tool plan --repo . --item workflow-case --json

  candidate_pr_verify_only:
    # GitHub validates the maximum job permissions even for a skipped publish
    # job. The caller grants write, but the candidate verify job is read-only
    # and publish_build: false skips the privileged job completely.
    permissions:
      contents: write
      packages: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-pr.yml@1d3dd4222a5e2000c8d65c7d96d2066ffabe9ceb
    with:
      full_run: true
      jobs: 2
      publish_build: false
      environment_json: '{"ACCEPTANCE_MARKER":"candidate-pr-verify"}'

  test:
    needs: [consumer, no_output, candidate_plan, candidate_pr_verify_only, candidate_action_run_only]
    runs-on: ubuntu-latest
    steps:
      - name: Verify candidate planning workflow outputs
        env:
          PLAN_JSON: ${{ needs.candidate_plan.outputs.plan_json }}
          SOURCE_SHA: ${{ needs.candidate_plan.outputs.source_sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os

          items = json.loads(os.environ["PLAN_JSON"])
          if [row["id"] for row in items] != ["workflow-case"]:
              raise SystemExit(f"unexpected candidate plan: {items}")
          if os.environ["SOURCE_SHA"] != os.environ["EXPECTED_SOURCE_SHA"]:
              raise SystemExit("candidate plan did not return exact caller SHA")
          PY

      - name: Verify no-output reusable workflow contract
        run: |
          if [ -n "${{ needs.no_output.outputs.build_artifact_name }}" ]; then
            echo "unexpected build artifact: ${{ needs.no_output.outputs.build_artifact_name }}"
            exit 1
          fi

      - name: Download reusable workflow build
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.consumer.outputs.build_artifact_name }}
          path: output/workflow-artifact

      - name: Verify reusable workflow output and evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("output/workflow-artifact")
          result = root / "workflow_case" / "result.txt"
          item_evidence = root / "workflow_case" / ".cad-ci" / "item.json"
          step_evidence = (
              root
              / "workflow_case"
              / ".cad-ci"
              / "steps"
              / "verify_environment.json"
          )

          if not result.is_file():
              raise SystemExit(f"missing handed-off output: {result}")
          result_text = result.read_text()
          if "reusable workflow executed caller item" not in result_text:
              raise SystemExit("handed-off result is not the caller workflow case")
          if "ghcr authentication available" not in result_text:
              raise SystemExit("consumer did not prove GHCR authentication")

          if not item_evidence.is_file():
              raise SystemExit(f"missing item evidence: {item_evidence}")
          item = json.loads(item_evidence.read_text())
          if item.get("schema") != 2 or item.get("status") != "pass":
              raise SystemExit(f"unexpected item evidence: {item}")
          if not item.get("run_started_at") or not item.get("run_finished_at"):
              raise SystemExit(f"missing item run timestamps: {item}")

          if not step_evidence.is_file():
              raise SystemExit(f"missing step evidence: {step_evidence}")
          step = json.loads(step_evidence.read_text())
          if step.get("schema") != 5:
              raise SystemExit(f"unexpected step evidence schema: {step}")
          for key in ("run_started_at", "run_finished_at", "started_at", "finished_at"):
              if not step.get(key):
                  raise SystemExit(f"missing step timing field {key}: {step}")
          if step.get("output_state") not in {"UNCHANGED", "RESTORED", "REPAIRED"}:
              raise SystemExit(f"missing public output_state: {step}")
          obsolete_term = "material" + "ization"
          if obsolete_term in json.dumps(step):
              raise SystemExit(f"obsolete output term leaked into evidence: {step}")

          if list(root.rglob(".cache")):
              raise SystemExit("private CAD-CI cache leaked into build artifact")
          PY

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap exact released tool
        run: python scripts/bootstrap.py
      - name: Verify released reusable workflow maintenance contract
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("ext/cad-ci/.github/workflows")
          run_workflow = (root / "reusable-run.yml").read_text(encoding="utf-8")
          high_workflow = (root / "reusable-ci.yml").read_text(encoding="utf-8")
          plan_workflow = (root / "reusable-plan.yml").read_text(encoding="utf-8")
          pr_workflow = (root / "reusable-pr.yml").read_text(encoding="utf-8")
          same_runner_action = (
              Path("ext/cad-ci/action.yml")
          ).read_text(encoding="utf-8")

          forbidden = (
              "actions/cache/restore",
              "actions/cache/save",
              "cache-primary-key",
              "restore-keys:",
          )
          found = [value for value in forbidden if value in run_workflow]
          if found:
              raise SystemExit(
                  "released reusable workflow still contains persistent cache "
                  "transport: " + ", ".join(found)
              )

          for value in (
              "concurrency:",
              "cancel-in-progress: true",
              "github.repository",
              "github.workflow",
              "github.event.pull_request.number || github.ref",
          ):
              if value not in high_workflow:
                  raise SystemExit(f"missing high-level concurrency contract: {value}")

          for name, text in (
              ("reusable-plan.yml", plan_workflow),
              ("reusable-run.yml", run_workflow),
          ):
              if "concurrency:" in text:
                  raise SystemExit(f"lower-level workflow owns concurrency: {name}")

          required_pr = (
              "runs-on: ubuntu-latest",
              "Checkout called tool revision",
              "Checkout pinned CAD CI library source",
              "PYTHONPATH:",
              "library-revision",
              "python -m cad_ci_tool build prepare-pr",
              "python -m cad_ci_tool publish build",
              "python -m cad_ci_tool publish build-cleanup",
              "cancel-in-progress: true",
              "Fetch exact PR base commit",
              "git fetch --no-tags --depth=1 origin",
              "--no-deps --no-compile",
              "docker login ghcr.io",
          )
          for value in required_pr:
              if value not in pr_workflow:
                  raise SystemExit(f"missing reusable-pr contract: {value}")

          if pr_workflow.count("runs-on: ubuntu-latest") != 1:
              raise SystemExit("reusable-pr must use exactly one runner job")
          for value in (
              "actions/upload-artifact",
              "actions/download-artifact",
              "pip install -e",
              "pip install .cache/cad-ci-tool-source",
              "docker/login-action",
              "fetch-depth: 0",
          ):
              if value in pr_workflow:
                  raise SystemExit(f"forbidden reusable-pr bootstrap: {value}")

          required_action = (
              "using: composite",
              "Checkout caller source",
              "Fetch exact base commit",
              "library-revision",
              "repository: brainboxemb/lib.py.cad.ci",
              "CAD_CI_TOOL_ROOT=$GITHUB_ACTION_PATH",
              "CAD_CI_LIB_ROOT=$GITHUB_WORKSPACE/.cache/cad-ci-lib-source",
              "PYTHONPATH=",
              "--no-deps --no-compile",
              "docker login ghcr.io",
              "Run selected CAD CI graph",
              "durable_scope:",
              "source_ref:",
              "durable-resolve",
              "durable-publish",
              "prepared_scope:",
              "build_commit:",
          )
          for value in required_action:
              if value not in same_runner_action:
                  raise SystemExit(f"missing same-runner action contract: {value}")
          if same_runner_action.count('scripts/reusable_ci.py" run') != 1:
              raise SystemExit("same-runner action must invoke exactly one CAD-CI run")
          for value in (
              "actions/upload-artifact",
              "actions/download-artifact",
              "site/build.py",
              "publish build",
              "publish pages",
          ):
              if value in same_runner_action:
                  raise SystemExit(f"consumer/publication behavior leaked into action: {value}")
          PY
      - name: Released merge-policy workflow
        run: python merge_policy_case/check.py
      # Candidate tests do not mutate any real repository state.
      # Released same-runner/durable action and dependencies.repos remain untouched.
      - name: Checkout exact tool candidate for isolated merge contract
        uses: actions/checkout@v4
        with:
          repository: brainboxemb/tool.cad.ci
          ref: 1d3dd4222a5e2000c8d65c7d96d2066ffabe9ceb
          path: candidate/cad-ci
          fetch-depth: 1
          persist-credentials: false
      - name: Check candidate merge operations with fake GitHub API
        run: python merge_policy_case/check_candidate.py

      - name: Install exact released tool stack
        run: python -m pip install -e ext/cad-ci
      - name: Simple item
        run: python simple_case1/check.py
      - name: Changed-item selection
        run: python more_complex_case2/check.py
      - name: Streamed execution logging
        run: python logging_case/check.py
      - name: Fresh runner Git-diff selection
        run: python fresh_runner_case/check.py
      - name: Nested local item configuration
        run: python nested_item_case/check.py
      - name: Nested durable publication
        run: python nested_publish_case/check.py
      - name: Dependencies and fan-out
        run: python dependency_case/check.py
      - name: Dependency output copy
        run: python dependency_copy_case/check.py
      - name: Active direct-dependent context
        run: python active_dependents_case/check.py
      - name: Partial reruns
        run: python partial_rerun_case/check.py
      - name: Process selection
        run: python process_case/check.py
      - name: Selective startup active closure
        run: python selective_startup_case/check.py
      - name: Bounded parallel jobs
        run: python parallel_jobs_case/check.py
      - name: Directory output and CacheDir
        run: python directory_output_case/check.py
      - name: Timeouts and failures
        run: python timeout_case/check.py
      - name: Durable build and Pages publication
        run: python publish_case/check.py
