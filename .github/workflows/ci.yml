name: Acceptance

on:
  pull_request:
    branches: [main, dev-cad, dev-ci]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev-cad, dev-ci]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@v0.33.2
    with:
      pull_request_policy: '{"stable_branch":"main","development_branches":["dev-cad","dev-ci"],"docs_only_prefixes":["docs/"]}'
      jobs: 2
      command_environment: '{"ACCEPTANCE_MARKER":"caller-value"}'

  durable:
    if: >-
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      (github.ref_name == 'main' ||
       github.ref_name == 'dev-cad' ||
       github.ref_name == 'dev-ci')
    permissions:
      contents: write
      packages: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-durable.yml@v0.33.2
    with:
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref_name }}
      scope: ${{ github.ref_name }}
      build_branch: test-output/build
      pages_branch: test-output/gh-pages
      jobs: 2
      command_environment: '{"ACCEPTANCE_MARKER":"caller-value"}'
