name: CAD CI reference

on:
  pull_request:
    branches: [main, dev-cad, dev-ci]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev-cad, dev-ci]
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only manual run mode.
        required: true
        type: choice
        options:
          - full
          - item
          - changed_paths
        default: full
      item:
        description: Exact CAD-CI item id when mode is item.
        required: false
        type: string
        default: ""
      changed_paths:
        description: JSON list of repository-relative paths when mode is changed_paths.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  pull_request:
    if: github.event_name == 'pull_request'
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@v0.36.1
    with:
      pull_request_policy: '{"stable_branch":"main","development_branches":["dev-cad","dev-ci"],"docs_only_prefixes":["docs/"]}'
      jobs: 2
      command_environment: '{"ACCEPTANCE_MARKER":"caller-value"}'

  branch_build:
    # Shared merge policy dispatches integration with GITHUB_TOKEN, which
    # arrives as workflow_dispatch from github-actions[bot] because GitHub does
    # not emit a second push workflow for that merge.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == 'github-actions[bot]' &&
       (github.ref_name == 'main' ||
        github.ref_name == 'dev-cad' ||
        github.ref_name == 'dev-ci'))
    permissions:
      contents: write
      packages: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-durable.yml@v0.36.1
    with:
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref_name }}
      scope: ${{ github.ref_name }}
      build_branch: test-output/build
      pages_branch: test-output/gh-pages
      jobs: 2
      command_environment: '{"ACCEPTANCE_MARKER":"caller-value"}'

  manual_input:
    if: github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate manual selection
        env:
          MODE: ${{ inputs.mode }}
          ITEM: ${{ inputs.item }}
          CHANGED_PATHS: ${{ inputs.changed_paths }}
        run: |
          case "$MODE" in
            full)
              test -z "$ITEM"
              test -z "$CHANGED_PATHS"
              ;;
            item)
              test -n "$ITEM"
              test -z "$CHANGED_PATHS"
              ;;
            changed_paths)
              test -z "$ITEM"
              test -n "$CHANGED_PATHS"
              ;;
            *)
              echo "unsupported manual mode: $MODE" >&2
              exit 2
              ;;
          esac

  manual_run:
    if: github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]'
    needs: manual_input
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@v0.36.1
    with:
      source_sha: ${{ github.sha }}
      full_run: ${{ inputs.mode == 'full' }}
      item: ${{ inputs.mode == 'item' && inputs.item || '' }}
      changed_paths: ${{ inputs.mode == 'changed_paths' && inputs.changed_paths || '' }}
      jobs: 2
      command_environment: '{"ACCEPTANCE_MARKER":"caller-value"}'
