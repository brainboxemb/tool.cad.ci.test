# template: tool.cad.ci/branch-cleanup
# template-version: 1
# tool-release: v0.27.0
#
# Copy this file to:
#   .github/workflows/branch-cleanup.yml
#
# This wrapper exposes an owner-issued /cleanup-branches command on any
# issue/PR conversation. The reusable tool workflow decides what may be deleted.

name: Branch cleanup

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      github.event.comment.body == '/cleanup-branches' &&
      github.actor == github.repository_owner
    permissions:
      contents: write
      pull-requests: read
      issues: write
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-branch-cleanup.yml@v0.27.0
    with:
      command: ${{ github.event.comment.body }}
      issue_number: ${{ github.event.issue.number }}

      # Repository policy: change only when this repository differs.
      stable_ref: main
      lane_refs_json: '["dev-cad","dev-ci"]'
      permanent_refs_json: '["build","gh-pages"]'
