# template: tool.cad.ci/branch-cleanup
# template-version: 2
# tool-release: v0.36.1

name: Branch cleanup

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      github.event.comment.body == '/cleanup-branches' &&
      github.actor == github.repository_owner
    permissions:
      contents: write
      pull-requests: read
      issues: write
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-branch-cleanup.yml@v0.36.1
    with:
      command: ${{ github.event.comment.body }}
      issue_number: ${{ github.event.issue.number }}
      stable_branch: main
      development_branches: '["dev-cad","dev-ci"]'
      permanent_branches: '["build","gh-pages","test-output/build","test-output/gh-pages"]'
