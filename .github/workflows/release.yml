# template: tool.cad.ci/cad-release
# template-version: 1
# tool-release: v0.36.1
#
# Owner-issued CAD-CI release. Generic build qualification and GitHub release
# mechanics stay in the released shared workflows.

name: Publish CAD release

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  release:
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/release ')
    permissions:
      contents: write
      issues: write
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-release.yml@v0.36.1
    with:
      command: ${{ github.event.comment.body }}
      issue_number: ${{ github.event.issue.number }}
      stable_ref: main
      build_branch: test-output/build
      # Optional repository-specific validator only:
      # validator_path: scripts/release/validate_release.py
