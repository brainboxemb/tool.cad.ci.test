# template: tool.cad.ci/branch-retirement
# template-version: 2
# tool-release: v0.33.2

name: Branch retirement

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  retire:
    if: >-
      startsWith(github.event.comment.body, '/retire-branches') &&
      github.actor == github.repository_owner
    permissions:
      contents: write
      pull-requests: read
      issues: write
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-branch-retirement.yml@v0.33.2
    with:
      command: ${{ github.event.comment.body }}
      issue_number: ${{ github.event.issue.number }}
      stable_branch: main
      development_branches: '["dev-cad","dev-ci"]'
      permanent_branches: '["build","gh-pages","test-output/build","test-output/gh-pages"]'
