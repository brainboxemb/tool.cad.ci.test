id: acceptance-suite
kind: acceptance

watch:
  - .github/workflows/**
  - cad-ci.yml
  - acceptance_suite/**
  - tests/**
  - workflow_case/**
  - test_roots/**
  - directory_output_case/**
  - timeout_case/**
  - publish_case/**
  - merge_policy_case/**

steps:
  - id: acceptance
    inputs:
      - acceptance_suite/run.py
      - tests/**
      - workflow_case/**
      - test_roots/**
      - directory_output_case/**
      - timeout_case/**
      - publish_case/**
      - merge_policy_case/**
    run: [python, run.py]
    outputs:
      - accepted.txt
      - result.txt
