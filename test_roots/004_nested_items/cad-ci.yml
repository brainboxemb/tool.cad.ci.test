schema: 1

templates:
  reference:
    kind: reference
    watch:
      item:
        - "**"
        - ../verification/reference_geometry.json
      repo:
        - shared.txt
    steps:
      - id: build
        inputs:
          item:
            - model.py
            - ../verification/reference_geometry.json
          repo:
            - shared.txt
        run: [python, model.py]
        outputs:
          - result.txt

items:
  - examples/*/*
